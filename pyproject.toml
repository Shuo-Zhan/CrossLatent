[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosslatent"
dynamic = ["version"]
license = {text = "MIT"}
description = "Orthogonal residual selection for compositional interpretation of fixed SAE features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "torch>=2.0", "tqdm>=4.64", "einops>=0.6", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Shuo-Zhan/CrossLatent"
Issues = "https://github.com/Shuo-Zhan/CrossLatent/issues"

[project.scripts]
crosslatent = "crosslatent.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "licenses/InterPLM-MIT.txt"]
packages = ["crosslatent", "crosslatent._core"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "crosslatent._identity.VERSION"}
